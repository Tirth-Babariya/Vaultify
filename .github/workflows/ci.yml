name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (crypto + merge logic)
        run: npm test
      - name: Production build (local-only mode, no Supabase keys)
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: unit-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser suites against a mock Supabase
        run: npm run test:e2e
      - name: Keep screenshots from the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
